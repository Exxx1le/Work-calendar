<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Общий календарь отпусков</title>
  <style>
    :root {
      --bg-color: #f8f9fa; --text-color: #333; --border-color: #ddd;
      --month-bg: #fff; --header-bg: #e9ecef; --highlight-fade: .25;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .left { flex: 1 1 300px; }
    h1 { font-size: 1.4rem; color: #343a40; margin-bottom: 12px; }
    .user-selector { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .current-user-display { position: relative; display: flex; align-items: center; cursor: pointer; padding: 8px 14px; background: white; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; min-width: 220px; justify-content: space-between; user-select: none; }
    .user-color-swatch { width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; display: inline-block; vertical-align: middle; }
    .dropdown-arrow { margin-left: 8px; opacity: .6; }
    .user-list { position: absolute; top: 44px; left: 0; background: white; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 1000; width: 340px; max-height: 300px; overflow-y: auto; display: none; }
    .user-list.open { display: block; }
    .user-item { padding: 10px 8px 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid #eee; transition: background .1s; }
    .user-item:last-child { border-bottom: none; }
    .user-item:hover { background: #f1f1f1; }
    .user-item.active { background: #e3f2fd; font-weight: 500; }
    .user-item .color-box { width: 12px; height: 12px; flex: 0 0 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,.1); }
    .user-item strong { overflow-wrap: anywhere; }
    button { padding: 8px 12px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: white; border-radius: 4px; transition: background .2s; }
    button:hover { background: #f1f1f1; }
    button:disabled { opacity: .55; cursor: wait; }
    button.active { font-weight: bold; border-color: #343a40; }
    .delete-user-btn { flex: 0 0 auto; padding: 5px 7px; font-size: 12px; color: #a12622; border-color: #e3b4b1; }
    .delete-user-btn:hover { background: #fdecea; }
    .controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .file-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .file-controls button { font-size: 13px; padding: 6px 10px; }
    .status { font-size: 13px; color: #666; text-align: center; min-height: 20px; margin-top: 8px; padding: 6px; background: #e8f4fd; border-radius: 4px; }
    .legend { margin-top: 16px; padding: 10px; background: #f1f1f1; border-radius: 6px; font-size: 14px; }
    .legend-row { display: flex; align-items: center; margin: 4px 0; }
    .swatch { width: 14px; height: 14px; margin-right: 8px; border-radius: 2px; display: inline-block; vertical-align: middle; flex: 0 0 14px; }
    .calendar-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    @media (max-width: 900px) { .calendar-container { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .calendar-container { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 430px) { .calendar-container { grid-template-columns: 1fr; } .user-list { width: min(340px, 90vw); } }
    .month { background: var(--month-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .month-header { background: var(--header-bg); padding: 8px 10px; font-weight: 600; text-align: center; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .month-header .month-name { flex-grow: 1; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #666; padding: 4px 0; border-bottom: 1px solid #eee; background: #fafafa; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px; gap: 1px; min-height: 140px; }
    .day { min-height: 42px; padding: 3px 2px 5px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; text-align: center; font-size: 13px; cursor: pointer; border-radius: 3px; transition: background .15s; position: relative; user-select: none; }
    .day:hover { background: #f0f0f0; }
    .day.weekend { background: #f8f9fa; color: #999; }
    .day.empty { cursor: default; }
    .day.vacation-current { background-color: rgba(74,144,226,var(--highlight-fade)) !important; }
    .day-number { line-height: 17px; }
    .day.vacation:not(.multiple)::after { content: ''; position: absolute; bottom: 2px; left: 5px; right: 5px; height: 3px; border-radius: 2px; background: var(--user-color,#4a90e2); }
    .overlap-count { display: inline-block; max-width: 100%; padding: 1px 3px; border-radius: 3px; color: #fff; background: #b42318; font-size: 9px; font-weight: 700; line-height: 12px; white-space: nowrap; letter-spacing: -.2px; }
    .day.vacation.multiple { background: #fff0ed; box-shadow: inset 0 0 0 1px #e76b5f; }
    .day.vacation.multiple.vacation-current { background: #ffe2dc !important; }
    .user-list .add-user-btn { display: block; width: 100%; text-align: center; padding: 8px 14px; border-top: 1px solid #eee; color: #27ae60; cursor: pointer; }
    .user-list .add-user-btn:hover { background: #e8f8f5; }
  </style>
</head>
<body>
  <header>
    <div class="left">
      <h1>Годовой календарь отпусков</h1>
      <div class="user-selector">
        <div class="current-user-display" id="currentUserDisplay" onclick="toggleUserDropdown()" role="button" tabindex="0">
          <span id="currentUserName">Выберите пользователя</span>
          <span class="user-color-swatch" id="currentUserColor" style="display:none"></span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div class="user-list" id="userList"></div>
      </div>
      <div class="controls">
        <button id="prevYear">&laquo; Предыдущий</button>
        <button id="currentYearBtn" class="active">Текущий год</button>
        <button id="nextYear">Следующий &raquo;</button>
      </div>
      <div class="file-controls">
        <button id="saveBtn" title="Сохранить изменения для всех сотрудников">Сохранить</button>
        <button id="exportBtn" title="Выгрузить текущие данные в CSV">Выгрузить CSV</button>
      </div>
    </div>
  </header>
  <div class="status" id="statusMsg">Подключение к общей базе данных…</div>
  <div class="calendar-container" id="calendar"></div>
  <div class="legend">
    <div class="legend-row"><span class="swatch" style="background:#fff;border:1px solid #ddd"></span>Обычный день</div>
    <div class="legend-row"><span class="swatch" style="background:#f8f9fa"></span>Выходной</div>
    <div class="legend-row"><span class="swatch" style="background:#4a90e2"></span>Отпуск одного сотрудника</div>
    <div class="legend-row"><span class="swatch" style="background:#b42318"></span>В ячейке показано количество сотрудников, выбравших эту дату; наведите курсор, чтобы увидеть имена.</div>
  </div>
  <script>
    // Общие данные загружаются и сохраняются через Cloudflare Pages Function.
    const USER_COLORS = ["#e74c3c","#3498db","#27ae60","#f39c12","#9b59b6","#1abc9c","#e67e22","#8e44ad","#d35400","#2980b9","#16a085","#c0392b","#7f8c8d","#34495e","#2c3e50"];
    const months = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const $ = id => document.getElementById(id);
    let users = {}, currentUserName = "", year = new Date().getFullYear(), userDropdownOpen = false, firstSelectedDate = null;
    let serverReady = false, saveInProgress = false, dirty = false;

    function setStatus(msg, error = false) {
      const el = $("statusMsg");
      el.textContent = msg;
      el.style.background = error ? "#fdecea" : "#e8f4fd";
      el.style.color = error ? "#a12622" : "#666";
    }
    function formatDate(y, m, d) { return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
    function chooseColor() {
      const used = new Set(Object.values(users).map(u => u.color));
      return USER_COLORS.find(c => !used.has(c)) || USER_COLORS[Object.keys(users).length % USER_COLORS.length];
    }
    function getCurrentUser() { return users[currentUserName] || null; }
    function escapeCSV(v) {
      const s = String(v ?? "");
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function csvText() {
      const rows = [["Сотрудник","Дата отпуска"]];
      Object.keys(users).sort((a,b) => a.localeCompare(b,"ru")).forEach(name => {
        users[name].dates.slice().sort().forEach(date => rows.push([name,date]));
      });
      return "\uFEFF" + rows.map(row => row.map(escapeCSV).join(";")).join("\r\n");
    }
    async function loadFromServer() {
      try {
        setStatus("Загружаю общие данные…");
        const response = await fetch("/api/data", {cache:"no-store"});
        if (!response.ok) throw new Error("Ошибка загрузки: HTTP " + response.status);
        const data = await response.json();
        users = (data.users && typeof data.users === "object") ? data.users : {};
        currentUserName = data.currentUserName && users[data.currentUserName] ? data.currentUserName : (Object.keys(users).sort((a,b) => a.localeCompare(b,"ru"))[0] || "");
        Object.values(users).forEach(u => {
          if (!u.color) u.color = "#3498db";
          if (!Array.isArray(u.dates)) u.dates = [];
          u.dates = [...new Set(u.dates)].sort();
        });
        serverReady = true; dirty = false; updateUI(); renderCalendar();
        setStatus("Данные загружены из общей базы. После изменений нажмите «Сохранить».");
      } catch (e) {
        serverReady = false;
        setStatus("Не удалось подключиться к общей базе: " + e.message + ". Обновите страницу или сообщите администратору.", true);
      }
    }
    async function saveToServer() {
      if (!serverReady) { setStatus("Сначала дождитесь загрузки данных с сервера.", true); return; }
      if (saveInProgress) return;
      saveInProgress = true; $("saveBtn").disabled = true;
      try {
        const response = await fetch("/api/data", {
          method:"PUT", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({users,currentUserName})
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || ("HTTP " + response.status));
        dirty = false;
        setStatus("Изменения сохранены в общей базе. Чтобы увидеть их на другом компьютере, откройте страницу заново.");
      } catch (e) {
        setStatus("Не удалось сохранить данные: " + e.message + ". Не закрывайте страницу; попробуйте ещё раз.", true);
      } finally {
        saveInProgress = false; $("saveBtn").disabled = false;
      }
    }
    function exportCSV() {
      const blob = new Blob([csvText()], {type:"text/csv;charset=utf-8;"});
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = `vacations_${year}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus("Создана резервная копия CSV в папке загрузок.");
    }
    function updateUI() {
      const nameEl = $("currentUserName"), swatch = $("currentUserColor"), u = getCurrentUser();
      nameEl.textContent = currentUserName || "Выберите пользователя";
      if (u) {
        swatch.style.backgroundColor = u.color; swatch.style.display = "inline-block";
        document.documentElement.style.setProperty("--user-color", u.color);
      } else swatch.style.display = "none";
      renderUserList();
    }
    function addUser() {
      const value = prompt("Введите имя нового пользователя:", "");
      if (value === null) return;
      const name = value.trim();
      if (!name) { alert("Имя не может быть пустым."); return; }
      if (name.length > 100) { alert("Имя не должно превышать 100 символов."); return; }
      if (users[name]) { alert("Такой пользователь уже существует."); return; }
      users[name] = {color:chooseColor(), dates:[]};
      currentUserName = name; dirty = true; updateUI(); renderCalendar();
      setStatus(`Пользователь «${name}» добавлен. Не забудьте нажать «Сохранить».`);
    }
    function deleteUser(name) {
      const user = users[name];
      if (!user) return;
      const confirmed = confirm(
        `Удалить сотрудника «${name}» и все его отпускные даты?\n\n` +
        `Количество отпускных дней: ${user.dates.length}.\n\n` +
        `Чтобы сохранить удаление для всех, после этого нажмите «Сохранить».`
      );
      if (!confirmed) return;
      delete users[name];
      if (currentUserName === name) {
        currentUserName = Object.keys(users).sort((a,b) => a.localeCompare(b,"ru"))[0] || "";
      }
      dirty = true; updateUI(); renderCalendar();
      setStatus(`Сотрудник «${name}» удалён. Нажмите «Сохранить», чтобы сохранить изменения для всех.`);
    }
    function renderUserList() {
      const list = $("userList");
      list.innerHTML = "";
      const add = document.createElement("div");
      add.className = "add-user-btn";
      add.textContent = "+ Добавить пользователя";
      add.onclick = addUser;
      list.appendChild(add);
      Object.keys(users).sort((a,b) => a.localeCompare(b,"ru")).forEach(name => {
        const user = users[name], item = document.createElement("div");
        item.className = "user-item" + (name === currentUserName ? " active" : "");
        const swatch = document.createElement("span");
        swatch.className = "color-box"; swatch.style.backgroundColor = user.color;
        const label = document.createElement("strong");
        label.textContent = `${name} (${user.dates.length} д.)`; label.style.flex = "1";
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-user-btn"; deleteButton.textContent = "Удалить";
        deleteButton.title = `Удалить сотрудника «${name}»`;
        deleteButton.onclick = event => { event.stopPropagation(); deleteUser(name); };
        item.onclick = () => {
          currentUserName = name; updateUI(); renderCalendar();
          list.classList.remove("open"); userDropdownOpen = false;
        };
        item.append(swatch, label, deleteButton);
        list.appendChild(item);
      });
    }
    function renderCalendar() {
      const calendar = $("calendar"); calendar.innerHTML = "";
      const map = {};
      Object.entries(users).forEach(([name,u]) => u.dates.forEach(d => { (map[d] ||= []).push(name); }));
      for (let m = 0; m < 12; m++) {
        const monthEl = document.createElement("div"); monthEl.className = "month";
        const head = document.createElement("div"); head.className = "month-header";
        const monthName = document.createElement("span"); monthName.className = "month-name"; monthName.textContent = months[m];
        const yearEl = document.createElement("span"); yearEl.textContent = year;
        head.append(monthName, yearEl); monthEl.appendChild(head);
        const weekdays = document.createElement("div"); weekdays.className = "weekdays";
        ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(d => { const el = document.createElement("div"); el.textContent = d; weekdays.appendChild(el); });
        monthEl.appendChild(weekdays);
        const days = document.createElement("div"); days.className = "days";
        const count = new Date(year,m+1,0).getDate(), offset = (new Date(year,m,1).getDay()+6)%7;
        for (let i = 0; i < offset; i++) { const empty = document.createElement("div"); empty.className = "day empty"; days.appendChild(empty); }
        for (let d = 1; d <= count; d++) {
          const date = formatDate(year,m,d), dow = (offset+d-1)%7, on = map[date] || [];
          const el = document.createElement("div"); el.className = "day" + (dow >= 5 ? " weekend" : ""); el.dataset.date = date;
          const number = document.createElement("span"); number.className = "day-number"; number.textContent = d; el.appendChild(number);
          if (on.length) {
            el.classList.add("vacation");
            if (on.length > 1) {
              el.classList.add("multiple");
              const badge = document.createElement("span"); badge.className = "overlap-count"; badge.textContent = `${on.length} чел.`; el.appendChild(badge);
            } else el.style.setProperty("--user-color", users[on[0]].color);
            if (on.includes(currentUserName)) el.classList.add("vacation-current");
            el.title = on.length > 1 ? `${on.length} сотрудника(ов):\n${on.join("\n")}` : `Отпуск: ${on[0]}`;
          } else el.title = date;
          days.appendChild(el);
        }
        monthEl.append(head, weekdays, days); calendar.appendChild(monthEl);
      }
      const user = getCurrentUser();
      setStatus(`Общая база · ${currentUserName || "пользователь не выбран"} · отпускных дней: ${user ? user.dates.length : 0}.`);
    }
    $("calendar").addEventListener("click", e => {
      const el = e.target.closest(".day:not(.empty)");
      if (!el) return;
      const user = getCurrentUser();
      if (!user) { setStatus("Сначала дождитесь загрузки данных и выберите или добавьте пользователя.", true); return; }
      const date = el.dataset.date;
      if (e.shiftKey && firstSelectedDate) {
        let a = new Date(firstSelectedDate + "T12:00:00"), b = new Date(date + "T12:00:00");
        if (a > b) [a,b] = [b,a];
        for (let d = new Date(a); d <= b; d.setDate(d.getDate()+1)) {
          const x = formatDate(d.getFullYear(),d.getMonth(),d.getDate());
          if (!user.dates.includes(x)) user.dates.push(x);
        }
        user.dates.sort(); firstSelectedDate = null;
      } else {
        const i = user.dates.indexOf(date);
        if (i < 0) user.dates.push(date); else user.dates.splice(i,1);
        user.dates.sort(); firstSelectedDate = date;
      }
      dirty = true; updateUI(); renderCalendar();
      setStatus("Изменение пока не сохранено на сервере. Нажмите «Сохранить».");
    });
    $("calendar").addEventListener("dblclick", () => {
      const user = getCurrentUser(); if (!user) return;
      if (confirm(`Удалить все отпускные даты пользователя «${currentUserName}»?`)) {
        user.dates = []; dirty = true; updateUI(); renderCalendar();
        setStatus("Отпуска очищены. Нажмите «Сохранить».");
      }
    });
    $("prevYear").onclick = () => { year--; $("currentYearBtn").classList.remove("active"); renderCalendar(); };
    $("nextYear").onclick = () => { year++; $("currentYearBtn").classList.remove("active"); renderCalendar(); };
    $("currentYearBtn").onclick = () => { year = new Date().getFullYear(); $("currentYearBtn").classList.add("active"); renderCalendar(); };
    $("saveBtn").onclick = saveToServer;
    $("exportBtn").onclick = exportCSV;
    window.toggleUserDropdown = function() {
      userDropdownOpen = !userDropdownOpen; $("userList").classList.toggle("open", userDropdownOpen);
    };
    document.addEventListener("click", e => {
      if (!e.target.closest(".user-selector")) { $("userList").classList.remove("open"); userDropdownOpen = false; }
    });
    window.addEventListener("beforeunload", e => {
      if (dirty) { e.preventDefault(); e.returnValue = ""; }
    });
    renderCalendar(); updateUI(); loadFromServer();
  </script>
</body>
</html>
